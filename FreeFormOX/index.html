<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon.svg">
  <title>FreeFormOX</title>

  <link id="bootstrap-theme-css" href="../shared/css/themes/superhero/bootstrap.min.css" rel="stylesheet">
  <link id="theme-override-mode" rel="stylesheet" href="../shared/css/themes/dark.css">
  <link id="theme-override-specific" rel="stylesheet" href="../shared/css/themes/superhero/superhero.css">
  <link rel="stylesheet" href="../shared/css/styles.css">
  <link rel="stylesheet" href="../shared/vendor/bootstrap-icons.css">
  <link rel="stylesheet" href="../shared/vendor/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="../shared/vendor/fontawesome/css/solid.min.css">
  <link rel="stylesheet" href="../shared/vendor/fontawesome/css/regular.min.css">
  <link rel="stylesheet" href="../shared/vendor/fontawesome/css/brands.min.css">
  <script src="../shared/js/build-number.js"></script>
  <script>
    // Cache-bust every same-origin link (stylesheet/manifest/icon) with the
    // build number so a new build always fetches fresh assets.
    (function () {
      if (typeof BUILD_NUMBER === "undefined") return;
      var stamp = function (u) { return u + (u.indexOf("?") >= 0 ? "&" : "?") + "v=" + BUILD_NUMBER; };
      var isLocal = function (u) { return u && u.indexOf("://") === -1 && u.charAt(0) !== "//"; };
      document.querySelectorAll("link[href]").forEach(function (l) {
        var h = l.getAttribute("href") || "";
        if (isLocal(h) && h.indexOf("v=") === -1) l.setAttribute("href", stamp(h));
      });
    })();
  </script>
</head>

<body>

  <!-- FIXED TOOLBAR -->
  <nav id="mainNav" class="navbar navbar-expand px-3 py-2 gap-1 flex-wrap">

    <div class="dropdown">
      <button id="btnMainMenu" class="btn p-1" data-bs-toggle="dropdown" title="Menu" aria-label="Menu">
        <i class="fa-solid fa-bars fs-5" aria-hidden="true"></i>
      </button>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" onclick="openSettings()">Settings</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="../">Launch</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" onclick="resetGame()">Replay</a></li>
        <li><a class="dropdown-item" onclick="swapPlayersAndRestart()">Swap Players &amp; Replay</a></li>
      </ul>
    </div>

  </nav>

  <!-- MAIN CONTENT -->
  <div class="container-fluid px-3">

    <div id="mainContent" class="d-flex flex-column justify-content-center align-items-center">
      <div id="turnIndicator" class="h1 mb-2 fw-bolder user-select-none d-flex align-items-center justify-content-center gap-1">X to go</div>
      <div id="buttonGrid" class="d-grid gap-1 p-1"></div>
      <div id="gameBtnContainer" class="position-relative w-100 mt-3">
        <div id="playBtns" class="position-absolute top-0 start-0 d-flex gap-3 w-100 h-100 invisible">
          <button id="undoBtn" class="btn btn-primary flex-grow-1 py-3 px-2" onclick="undoMove()">Undo</button>
          <button id="redoBtn" class="btn btn-secondary flex-grow-1 py-3 px-2" onclick="redoMove()">Redo</button>
        </div>
        <div id="endBtns" class="position-absolute top-0 start-0 d-flex gap-3 w-100 h-100 invisible">
          <button id="replayBtn" class="btn btn-primary flex-grow-1 py-3 px-2" onclick="resetGame()">Replay</button>
          <button id="swapBtn" class="btn btn-outline-secondary flex-grow-1 py-3 px-2" onclick="swapPlayersAndRestart()">Swap Players &amp; Replay</button>
        </div>
      </div>
    </div>

    <!-- SETTINGS PAGE -->
    <smd-page id="settingsPage" class="d-none"></smd-page>

    <template id="settingsTemplate">
      <div class="smd-settings">

        <!-- Game -->
        <section class="smd-settings-tab" data-tab="Game" data-tab-id="game-tab">
          <div class="row mb-3 align-items-center col-md-8 mt-3">
            <div class="col-4 text-end"><label class="form-label mb-0">Theme</label></div>
            <div class="col-8">
              <smd-theme id="themeSelector"></smd-theme>
            </div>
          </div>

          <div class="row mb-3 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">Font size</label></div>
            <div class="col-8">
              <select id="fontSizeSelector" class="form-select" onchange="changeFontSize(this.value)">
                <option value="xsmall">Extra small</option>
                <option value="small">Small</option>
                <option value="normal">Normal</option>
                <option value="large">Large</option>
                <option value="xlarge">Extra large</option>
                <option value="jumbo">Jumbo</option>
              </select>
            </div>
          </div>

          <div class="row mb-3 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">X name</label></div>
            <div class="col-8">
              <input id="xName" class="form-control" type="text" maxlength="20" onchange="saveName('x', this.value)">
            </div>
          </div>
          <div class="row mb-3 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">X style</label></div>
            <div class="col-8">
              <select id="xPieceStyle" class="form-select" onchange="changePieceStyle('x', this.value)">
                <option value="classic">Classic</option>
                <option value="dino">Dino</option>
                <option value="unicorn">Unicorn</option>
              </select>
            </div>
          </div>

          <div class="row mb-3 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">O name</label></div>
            <div class="col-8">
              <input id="oName" class="form-control" type="text" maxlength="20" onchange="saveName('o', this.value)">
            </div>
          </div>
          <div class="row mb-3 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">O style</label></div>
            <div class="col-8">
              <select id="oPieceStyle" class="form-select" onchange="changePieceStyle('o', this.value)">
                <option value="classic">Classic</option>
                <option value="dino">Dino</option>
                <option value="unicorn">Unicorn</option>
              </select>
            </div>
          </div>

          <div class="row mb-3 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">Show undo/redo</label></div>
            <div class="col-8">
              <smd-checkbox id="showPlayReplay" switch onchange="savePlayReplaySetting(this.checked)"></smd-checkbox>
            </div>
          </div>

          <div class="row mb-3 align-items-center col-md-8">
            <div class="col-4 text-end"></div>
            <div class="col-8">
              <smd-button variant="primary" onclick="swapPlayersAndRestart()">Swap Players &amp; Restart</smd-button>
            </div>
          </div>
        </section>

        <div id="settingsFooter" class="mt-3">
          <div class="row align-items-center col-md-8 mb-3">
            <div class="col-4 text-end"></div>
            <div class="col-8">
              <smd-buymeacoffee class="d-block" username="ownimage" height="50"></smd-buymeacoffee>
            </div>
          </div>

          <div class="row mb-4 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">Share app</label></div>
            <div class="col-8">
              <smd-qrcode id="shareQrCode" value="https://ownimage.github.io/FreeFormOX" size="120"></smd-qrcode>
            </div>
          </div>

          <div class="mt-5 small build-number">Build <span id="buildNumber"></span></div>

          <smd-fontawesome-credit class="mt-2"></smd-fontawesome-credit>
        </div>
      </div>
    </template>

  </div>

  <!-- BOOTSTRAP JS -->
  <script>document.write('<script src="../shared/vendor/bootstrap.bundle.min.js?v=' + BUILD_NUMBER + '"><\/script>');</script>

  <script>
  document.write('<script src="../shared/js/components/smd-button.js?v=' + BUILD_NUMBER + '"><\/script>');
  document.write('<script src="../shared/js/components/smd-page.js?v=' + BUILD_NUMBER + '"><\/script>');
  document.write('<script src="../shared/js/components/smd-tabs.js?v=' + BUILD_NUMBER + '"><\/script>');
  document.write('<script src="../shared/js/components/smd-theme.js?v=' + BUILD_NUMBER + '"><\/script>');
  document.write('<script src="../shared/js/components/smd-checkbox.js?v=' + BUILD_NUMBER + '"><\/script>');
  document.write('<script src="../shared/js/components/smd-buymeacoffee.js?v=' + BUILD_NUMBER + '"><\/script>');
  document.write('<script src="../shared/js/components/smd-qrcode.js?v=' + BUILD_NUMBER + '"><\/script>');
  document.write('<script src="../shared/js/components/smd-fontawesome-credit.js?v=' + BUILD_NUMBER + '"><\/script>');
  document.write('<script src="../shared/js/smd-app.js?v=' + BUILD_NUMBER + '"><\/script>');
  document.write('<script src="../shared/js/smd-settings.js?v=' + BUILD_NUMBER + '"><\/script>');
  document.write('<script src="../shared/js/smd-contrast.js?v=' + BUILD_NUMBER + '"><\/script>');
  document.write('<script src="js/settings.js?v=' + BUILD_NUMBER + '"><\/script>');
  document.write('<script src="js/app.js?v=' + BUILD_NUMBER + '"><\/script>');
  </script>

  <script>
  if ("serviceWorker" in navigator) {
    var __updatePrompted = false;
    var __applyingUpdate = false;
    var __dismissedUpdate = "";
    try { __dismissedUpdate = localStorage.getItem("swUpdateDismissedUrl") || ""; } catch (e) { __dismissedUpdate = ""; }
    function showUpdatePrompt(reg) {
      var w = reg && reg.waiting;
      if (w && w.scriptURL === __dismissedUpdate) return; // user already dismissed THIS pending SW
      if (__updatePrompted) return;
      __updatePrompted = true;
      if (typeof showSmdModal === "function") {
        showSmdModal({
          title: "Update available",
          content: "A new version of FreeFormOX is ready. Update now to get the latest changes?",
          buttons: [
            { text: "Later", variant: "secondary", action: "later" },
            { text: "Update now", variant: "primary", action: "update" }
          ],
          onAction: function(detail) {
            var pending = reg && reg.waiting;
            if (!pending) return;
            if (detail.action === "update") {
              try { localStorage.removeItem("swUpdateDismissedUrl"); } catch (e) {}
              __applyingUpdate = true;
              pending.postMessage({ type: "SKIP_WAITING" });
            } else if (detail.action === "later") {
              try { localStorage.setItem("swUpdateDismissedUrl", pending.scriptURL); } catch (e) {}
            }
          }
        });
      }
    }

    navigator.serviceWorker.register("../sw.js").then(function(reg) {
      if (navigator.serviceWorker.controller) {
        if (reg.waiting) showUpdatePrompt(reg);
        reg.addEventListener("updatefound", function() {
          var inst = reg.installing;
          if (!inst) return;
          inst.addEventListener("statechange", function() {
            if (inst.state === "installed" && navigator.serviceWorker.controller) showUpdatePrompt(reg);
          });
        });
      }
      window.addEventListener("focus", function() { if (reg.update) reg.update(); });
    });

    navigator.serviceWorker.addEventListener("controllerchange", function() {
      if (!__applyingUpdate) return;
      window.location.reload();
    });
  }
  </script>

</body>
</html>
