<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-theme="superhero">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlanMyDay - Component Storybook</title>
  <link id="bootstrap-theme-css" href="../shared/css/themes/superhero/bootstrap.min.css" rel="stylesheet">
  <link id="theme-override-mode" rel="stylesheet" href="../shared/css/themes/dark.css">
  <link id="theme-override-specific" rel="stylesheet" href="../shared/css/themes/superhero/superhero.css">
  <link rel="stylesheet" href="../shared/vendor/bootstrap-icons.css">
  <link rel="stylesheet" href="../shared/vendor/flatpickr.min.css">
  <link rel="stylesheet" href="../shared/css/styles.css">
  <link rel="stylesheet" href="../shared/vendor/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="../shared/vendor/fontawesome/css/solid.min.css">
  <link rel="stylesheet" href="../shared/vendor/fontawesome/css/regular.min.css">
  <link rel="stylesheet" href="../shared/vendor/fontawesome/css/brands.min.css">
  <style>
    :root {
      --sb-bg: var(--bs-body-bg, #222);
      --sb-fg: var(--bs-body-color, #eee);
      --sb-border: var(--bs-border-color, #444);
      --sb-color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { overflow-x: clip; background-color: var(--bs-body-bg); }
    body { overflow-x: clip; max-width: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bs-body-bg);
      color: var(--sb-fg);
    }
    header.sb-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 0.75rem 1.25rem;
      background: color-mix(in srgb, var(--sb-bg) 85%, white);
      border-bottom: 1px solid var(--sb-border);
    }
    header.sb-header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      flex: 0 1 auto;
      min-width: 0;
      overflow-wrap: break-word;
    }
    .sb-theme-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: auto;
    }
    .sb-theme-control select {
      padding: 0.3rem 0.6rem;
      border: 1px solid var(--sb-border);
      border-radius: 6px;
      background: var(--sb-select-bg, var(--bs-tertiary-bg, #252525));
      color: var(--sb-select-color, var(--sb-fg));
      color-scheme: var(--sb-color-scheme, dark);
    }
    .sb-theme-control select option {
      color: var(--sb-select-color, var(--sb-fg));
      background: var(--sb-select-bg, var(--bs-tertiary-bg, #252525));
    }
    nav.sb-nav {
      position: sticky;
      top: 57px;
      z-index: 999;
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      padding: 0.5rem 1.25rem;
      background: var(--sb-bg);
      border-bottom: 1px solid var(--sb-border);
    }
    nav.sb-nav a {
      color: var(--bs-secondary-color, #aaa);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 0.2rem 0.6rem;
      border: 1px solid var(--sb-border);
      border-radius: 999px;
    }
    nav.sb-nav a:hover { color: var(--sb-fg); border-color: var(--bs-primary, #0d6efd); }
    main.sb-main { padding: 1rem 1.25rem 4rem; max-width: 100%; }
    section.sb-section {
      margin-bottom: 2.5rem;
      border: 1px solid var(--sb-border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      background: var(--sb-bg);
      max-width: 100%;
      overflow-wrap: break-word;
    }
    section.sb-section > h2 {
      margin: 0 0 0.15rem;
      font-size: 1.1rem;
      font-weight: 700;
    }
    section.sb-section > .sb-tag {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      color: var(--bs-secondary-color, #aaa);
      background: var(--sb-bg);
      border: 1px solid var(--sb-border);
      border-radius: 6px;
      padding: 0.1rem 0.45rem;
      margin-bottom: 0.75rem;
    }
    section.sb-section > p.sb-desc {
      color: var(--bs-secondary-color, #aaa);
      font-size: 0.9rem;
      margin: 0 0 1rem;
    }
    .sb-canvas {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: flex-start;
      padding: 1rem;
      border: 1px dashed var(--sb-border);
      border-radius: 8px;
      background: var(--sb-bg);
      max-width: 100%;
    }
    .sb-canvas > div, .sb-canvas > * { min-width: 0; max-width: 100%; }
    .sb-controls {
      margin-top: 1rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .sb-controls label { font-size: 0.85rem; }
    .sb-controls input[type="text"], .sb-controls select {
      padding: 0.25rem 0.5rem;
      border: 1px solid var(--sb-border);
      border-radius: 6px;
      background: var(--sb-bg);
      color: var(--sb-fg);
    }
    .sb-controls button.btn.sb-run {
      border: 1px solid var(--bs-primary, #0d6efd);
      background: var(--bs-primary, #0d6efd);
      color: #fff;
      padding: 0.25rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .sb-log {
      margin-top: 0.75rem;
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      color: var(--bs-success, #198754);
      background: var(--sb-bg);
      border: 1px solid var(--sb-border);
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      min-height: 1.6rem;
    }
    .sb-placeholder {
      color: var(--bs-secondary-color, #aaa);
      font-style: italic;
      font-size: 0.9rem;
    }
    .sb-swatches {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }
    .sb-swatch { min-width: 0; }
    .sb-swatch-color {
      height: 48px;
      border-radius: 6px;
      background-clip: padding-box;
    }
    .sb-swatch-name {
      margin-top: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.64rem;
      line-height: 1.15;
      color: var(--bs-secondary-color, #aaa);
      overflow-wrap: anywhere;
    }
    .sb-swatch-group { width: 100%; }
    .sb-swatch-group + .sb-swatch-group { margin-top: 1.25rem; }
    .sb-swatch-group-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--bs-secondary-color, #aaa);
      margin-bottom: 0.5rem;
    }
    .sb-row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: flex-start; }
    .sb-stack { display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; flex: 1 1 260px; max-width: 100%; }
    code { background: var(--sb-bg); padding: 0.05rem 0.3rem; border-radius: 4px; font-size: 0.82em; }
    .sb-frame-wrapper { width: 100%; }
    .sb-frame-wrapper .sb-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--bs-secondary-color, #aaa);
      margin-bottom: 0.4rem;
    }
    /* the pmd-stream-header drag handle is a sibling in the card wrapper */
    .sb-stream-card {
      border: 1px solid var(--sb-border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--sb-bg);
    }
    .sb-stream-card .sb-stream-head { padding: 0; }
    .sb-stream-card .sb-stream-body { padding: 0; }
    /* adjacent job cards touch: overlap borders to keep a single 1px line */
    .sb-stream-card .sb-stream-body pmd-job-stream-card + pmd-job-stream-card { margin-top: -1px; }
    .sb-hint { color: var(--bs-secondary-color, #aaa); font-size: 0.8rem; }
    .sb-stream-card { transition: border-color 0.2s ease; }
    .sb-stream-card.is-expanded { border-color: var(--bs-info, #0dcaf0); }
  </style>
</head>
<body>

  <header class="sb-header">
    <h1>PlanMyDay &middot; Web Component Storybook</h1>
    <div class="sb-theme-control">
      <label for="themeSelect">Theme</label>
      <select id="themeSelect"></select>
    </div>
  </header>

  <nav class="sb-nav" aria-label="Sections"></nav>

  <main class="sb-main" id="main"></main>

  <!-- ============================ COMPONENT SCRIPTS ============================ -->
  <script src="../shared/js/components/smd-button.js"></script>
  <script src="../shared/js/components/smd-image.js"></script>
  <script src="../shared/js/components/smd-modal.js"></script>
  <script src="../shared/js/components/smd-page.js"></script>
  <script src="../shared/js/components/smd-tabs.js"></script>
  <script src="../shared/js/components/smd-qrcode.js"></script>
  <script src="../shared/js/components/smd-qr-export.js"></script>
  <script src="../shared/js/components/smd-qr-import.js"></script>
  <script src="../shared/js/components/smd-buymeacoffee.js"></script>
  <script src="../shared/js/components/smd-fontawesome-credit.js"></script>
  <script src="../shared/js/components/smd-image-card.js"></script>
  <script src="../shared/js/components/smd-image-select.js"></script>
  <script src="../shared/js/components/smd-image-editor.js"></script>
  <script src="../shared/js/components/smd-theme.js"></script>
  <script src="../shared/js/components/smd-checkbox.js"></script>
  <script src="../shared/js/components/smd-draghandle.js"></script>
  <script src="../shared/js/components/smd-badge.js"></script>
  <script src="../shared/js/components/smd-image-dropdown.js"></script>
  <script src="../shared/js/components/smd-image-picker.js"></script>
  <script src="../shared/vendor/flatpickr.min.js"></script>
  <script src="../shared/js/components/smd-date-picker.js"></script>
  <script src="../PlanMyDay/js/components/pmd-stream-header.js"></script>
  <script src="../PlanMyDay/js/components/pmd-job-stream-card.js"></script>
  <script src="../PlanMyDay/js/components/pmd-job-search-card.js"></script>
  <script src="../PlanMyDay/js/components/pmd-job-today-card.js"></script>
  <script src="../CountMyDays/js/components/cmd-countdown-card.js"></script>
  <script src="../CountMyDays/js/components/cmd-date-card.js"></script>
  <script src="../CountMyDays/js/components/cmd-category-card.js"></script>
  <script src="../QRLinks/js/components/qrlink-card.js"></script>
  <script src="../shared/vendor/qrcode.min.js"></script>
  <script src="../shared/js/build-number.js"></script>
  <script src="../shared/js/smd-app.js"></script>
  <script src="../shared/js/smd-settings.js"></script>
  <script src="../shared/js/smd-contrast.js"></script>
  <script src="../shared/js/smd-images.js"></script>

  <script>
    // ---- Theme selector: uses the SAME themeConfig + applyTheme as the app ----
    // (settings.js is loaded above, giving us themeConfig, applyTheme, applySmdVars).
    const appThemeBefore = localStorage.getItem("planmydays_theme");
    function sbApplyTheme(name) {
      const c = themeConfig[name] || themeConfig.superhero;
      applyTheme(name); // identical logic to the app (CSS + data-* attrs + --smd-* vars + ?v stamp)
      // neutralize the app-preference side effect applyTheme persisting; storybook
      // keeps its own storage key so it never changes the real app theme.
      if (appThemeBefore === null) localStorage.removeItem("planmydays_theme");
      else localStorage.setItem("planmydays_theme", appThemeBefore);
      // set color-scheme so native form controls (e.g. select dropdowns) match
      // the applied theme instead of rendering white-on-white
      document.documentElement.style.setProperty("--sb-color-scheme", c.bsTheme);
      // give the theme selector readable colors regardless of the theme's own
      // --bs-* variable combinations (e.g. quartz has light backgrounds + white text)
      document.documentElement.style.setProperty(
        "--sb-select-bg",
        c.bsTheme === "dark" ? "#252525" : "#f8f9fa"
      );
      document.documentElement.style.setProperty(
        "--sb-select-color",
        c.bsTheme === "dark" ? "#eee" : "#111"
      );
    }

    // ---- Build theme selector ----
    const themeSelect = document.getElementById("themeSelect");
    Object.keys(themeConfig).forEach(name => {
      const opt = document.createElement("option");
      opt.value = name;
      const label = name.charAt(0).toUpperCase() + name.slice(1);
      opt.textContent = label + " (" + themeConfig[name].bsTheme + ")";
      themeSelect.appendChild(opt);
    });
    const sbSavedTheme = localStorage.getItem("storybook_theme") || "superhero";
    themeSelect.value = sbSavedTheme;
    sbApplyTheme(sbSavedTheme);
    themeSelect.addEventListener("change", () => {
      sbApplyTheme(themeSelect.value);
      localStorage.setItem("storybook_theme", themeSelect.value);
      // re-render sections that need to reflect theme-changed state
      renderAll();
    });

    // ---- Small SVG image so pmd thumbnails render without the app ----
    const SVG = (fill) => "data:image/svg+xml;utf8," + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" rx="8" fill="${fill}"/><circle cx="20" cy="16" r="7" fill="#fff"/><path d="M8 36c0-7 5-11 12-11s12 4 12 11z" fill="#fff"/></svg>`
    );
    // Seed a neutral localStorage images store (keyPrefix + "images") for the
    // pmd components' <smd-image> thumbnails (they look up images by NAME).
    function sbSeed(prefix, entries) {
      localStorage.setItem(prefix + "images", JSON.stringify(entries.map(([name, fill]) => ({ name, data: SVG(fill) }))));
    }
    // Seed NOW (before renderAll builds the sections) so any element carrying
    // image="name" resolves its thumbnail immediately.
    const SB_PMD_PAIRS = [["Blue", "#375a7f"], ["Green", "#00bc8c"]];
    sbSeed("sbh_", SB_PMD_PAIRS); // pmd-stream-header
    sbSeed("sbc_", SB_PMD_PAIRS); // pmd-job-stream-card
    sbSeed("sbj_", SB_PMD_PAIRS); // pmd-job-search-card
    sbSeed("sbp_", SB_PMD_PAIRS); // pmd-stream (combined)
    sbSeed("sbt_", SB_PMD_PAIRS); // pmd-job-today-card
    sbSeed("sbip_", SB_PMD_PAIRS); // smd-image-picker

    function log(section, msg) {
      const el = document.getElementById("log-" + section);
      if (el) el.textContent = "event: " + msg;
    }

    function escHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ============================ SECTION DEFINITIONS ============================
    const sections = [];

    // Bootstrap colour variables (the :root/[data-bs-theme] blocks) grouped into
    // sensible rows and shown as swatches.
    const THEME_COLOR_GROUPS = [
      {
        label: "Palette",
        vars: [
          "--bs-blue", "--bs-indigo", "--bs-purple", "--bs-pink", "--bs-red",
          "--bs-orange", "--bs-yellow", "--bs-green", "--bs-teal", "--bs-cyan"
        ]
      },
      {
        label: "Neutrals",
        vars: [
          "--bs-black", "--bs-white", "--bs-gray", "--bs-gray-dark",
          "--bs-gray-100", "--bs-gray-200", "--bs-gray-300", "--bs-gray-400", "--bs-gray-500",
          "--bs-gray-600", "--bs-gray-700", "--bs-gray-800", "--bs-gray-900",
          "--bs-white-rgb", "--bs-black-rgb"
        ]
      },
      {
        label: "Theme colours",
        vars: [
          "--bs-primary", "--bs-secondary", "--bs-success", "--bs-info",
          "--bs-warning", "--bs-danger", "--bs-light", "--bs-dark",
          "--bs-primary-rgb", "--bs-secondary-rgb", "--bs-success-rgb", "--bs-info-rgb",
          "--bs-warning-rgb", "--bs-danger-rgb", "--bs-light-rgb", "--bs-dark-rgb"
        ]
      },
      {
        label: "Body & surfaces",
        vars: [
          "--bs-body-color", "--bs-body-color-rgb", "--bs-body-bg", "--bs-body-bg-rgb",
          "--bs-emphasis-color", "--bs-emphasis-color-rgb",
          "--bs-secondary-color", "--bs-secondary-color-rgb", "--bs-secondary-bg", "--bs-secondary-bg-rgb",
          "--bs-tertiary-color", "--bs-tertiary-color-rgb", "--bs-tertiary-bg", "--bs-tertiary-bg-rgb"
        ]
      },
      {
        label: "Text emphasis",
        vars: [
          "--bs-primary-text-emphasis", "--bs-secondary-text-emphasis", "--bs-success-text-emphasis",
          "--bs-info-text-emphasis", "--bs-warning-text-emphasis", "--bs-danger-text-emphasis",
          "--bs-light-text-emphasis", "--bs-dark-text-emphasis"
        ]
      },
      {
        label: "Subtle backgrounds",
        vars: [
          "--bs-primary-bg-subtle", "--bs-secondary-bg-subtle", "--bs-success-bg-subtle",
          "--bs-info-bg-subtle", "--bs-warning-bg-subtle", "--bs-danger-bg-subtle",
          "--bs-light-bg-subtle", "--bs-dark-bg-subtle"
        ]
      },
      {
        label: "Subtle borders",
        vars: [
          "--bs-primary-border-subtle", "--bs-secondary-border-subtle", "--bs-success-border-subtle",
          "--bs-info-border-subtle", "--bs-warning-border-subtle", "--bs-danger-border-subtle",
          "--bs-light-border-subtle", "--bs-dark-border-subtle"
        ]
      },
      {
        label: "Links & text",
        vars: [
          "--bs-heading-color", "--bs-link-color", "--bs-link-hover-color",
          "--bs-link-color-rgb", "--bs-link-hover-color-rgb",
          "--bs-code-color", "--bs-highlight-color", "--bs-highlight-bg"
        ]
      },
      {
        label: "Borders",
        vars: [
          "--bs-border-color", "--bs-border-color-translucent", "--bs-focus-ring-color"
        ]
      },
      {
        label: "Form validation",
        vars: [
          "--bs-form-valid-color", "--bs-form-valid-border-color",
          "--bs-form-invalid-color", "--bs-form-invalid-border-color"
        ]
      },
      {
        label: "Gradient",
        vars: ["--bs-gradient"]
      }
    ];

    // ---- Theme colours ----
    sections.push({
      id: "theme-colours",
      name: "Theme Colours",
      tag: "CSS variables",
      desc: "Every Bootstrap colour variable (the <code>:root</code> / <code>[data-bs-theme]</code> blocks) as a swatch, grouped into rows. Each swatch reads its CSS variable live, so the colours update when you change the theme.",
      html: () => `
        <div class="sb-canvas" style="flex-direction:column;width:100%">
          ${THEME_COLOR_GROUPS.map((group) => `
            <div class="sb-swatch-group">
              <div class="sb-swatch-group-label">${group.label}</div>
              <div class="sb-swatches">${group.vars.map((name) => {
                const bg = /-rgb$/.test(name) ? `rgb(var(${name}))` : `var(${name})`;
                return `<div class="sb-swatch"><div class="sb-swatch-color" style="background:${bg}"></div><div class="sb-swatch-name">${name}</div></div>`;
              }).join("")}</div>
            </div>`).join("")}
        </div>
      `,
      init: () => {}
    });

    // ---- smd-button ----
    sections.push({
      id: "smd-button",
      name: "smd-button",
      tag: "<smd-button>",
      desc: "A themed button. Set <code>variant</code> (primary | secondary | success | danger), optionally <code>disabled</code>, and <code>size</code> (normal | small — adds <code>btn-sm</code>). Content is slotted.",
      html: () => {
        const variants = ["primary", "secondary", "success", "danger"];
        return `
          <div class="sb-canvas">
            <div class="sb-stack">
              ${variants.map(v =>
                `<div class="sb-row">
                  <smd-button variant="${v}" size="small">${v} (small)</smd-button>
                  <smd-button variant="${v}">${v}</smd-button>
                  <smd-button variant="${v}" disabled>${v} (disabled)</smd-button>
                </div>`).join("")}
            </div>
          </div>
          <div class="sb-log" id="log-smd-button">events: none yet</div>
        `;
      },
      init: () => {
        document.querySelectorAll("#smd-button smd-button").forEach((btn, i) => {
          btn.addEventListener("click", () => log("smd-button", "clicked: " + (btn.textContent || btn.variant)));
        });
      }
    });

    // ---- smd-modal ----
    sections.push({
      id: "smd-modal",
      name: "smd-modal",
      tag: "<smd-modal>",
      desc: "A modal with <code>title</code>, <code>content</code> and <code>buttons</code> (JS properties). Call <code>show()</code>/<code>hide()</code>. Clicking a footer button closes the modal (unless the button sets <code>close: false</code>) and dispatches <code>smd-modal-action</code>.",
      html: () => `
        <div class="sb-canvas">
          <smd-button variant="primary">Open modal</smd-button>
        </div>
        <div class="sb-controls">
          <label>Buttons: <select id="ctrl-modal-buttons">
            <option value="ok">OK</option>
            <option value="okcancel" selected>OK / Cancel</option>
            <option value="3">OK / Cancel / Danger</option>
          </select></label>
        </div>
        <div class="sb-log" id="log-smd-modal">events: none yet</div>
      `,
      init: () => {
        const modal = document.getElementById("sb-modal");
        document.querySelector("#smd-modal smd-button").addEventListener("click", () => modal.show());
        const btnSet = document.getElementById("ctrl-modal-buttons");
        const applyButtons = () => {
          const v = btnSet.value;
          if (v === "ok") modal.buttons = [{ text: "OK", variant: "primary", action: "ok" }];
          else if (v === "okcancel") modal.buttons = [
            { text: "Cancel", variant: "secondary", action: "cancel" },
            { text: "OK", variant: "primary", action: "ok" }
          ];
          else modal.buttons = [
            { text: "Cancel", variant: "secondary", action: "cancel" },
            { text: "Delete", variant: "danger", action: "delete" },
            { text: "OK", variant: "success", action: "ok" }
          ];
        };
        btnSet.addEventListener("change", applyButtons);
        modal.addEventListener("smd-modal-action", (e) => log("smd-modal", "action=\"" + e.detail.action + "\" (" + e.detail.text + ")"));
        applyButtons();
      }
    });

    // ---- smd-page ----
    sections.push({
      id: "smd-page",
      name: "smd-page",
      tag: "<smd-page>",
      desc: "A full-screen animated page with <code>title</code>, optional <code>headerHtml</code>, <code>content</code>, and footer <code>buttons</code>. Call <code>show()</code>/<code>hide()</code>. Clicking a footer button closes the page (unless the button sets <code>close: false</code>) and dispatches <code>smd-page-action</code>. Slide in/out duration in ms is configurable via the <code>slide-duration</code> attribute or <code>slideDuration</code> property (0 = instant).",
      html: () => `
        <div class="sb-canvas">
          <smd-button variant="success">Open page</smd-button>
        </div>
        <div class="sb-controls">
          <label>Title: <input type="text" id="ctrl-page-title" value="SmdPage title"></label>
          <label><input type="checkbox" id="ctrl-page-badge"> Show badge in header</label>

              <div class="sb-label">Expanded stream (with can-delete)</div>

                <div class="sb-stream-head"><pmd-stream-header stream-idx="1" title="Home" tab="maintenance" image="Green" key-prefix="sbp_" jobcounts="0/1/4" expanded can-delete></pmd-stream-header></div>

          <cmd-date-card index="3" name="Surprise Party Planning" type="once" date-text="14 Nov 2026" source="google" hidden="true" key-prefix="sbc_" style="width:100%"></cmd-date-card>
        </div>
        <div class="sb-log" id="log-cmd-date-card">events: none</div>
      `,
      init: () => {
        document.querySelectorAll("#cmd-date-card cmd-date-card").forEach(card => {
          card.addEventListener("cmd-date-edit", (e) => log("cmd-date-card", "edit idx=" + e.detail.index));
          card.addEventListener("cmd-date-delete", (e) => log("cmd-date-card", "delete idx=" + e.detail.index));
        });
      }
    });

    // ---- cmd-category-card ----
    sections.push({
      id: "cmd-category-card",
      name: "cmd-category-card",
      tag: "<cmd-category-card>",
      desc: "A category row in the categories editor list. Attributes: <code>index</code>, <code>name</code>, <code>image</code>, <code>key-prefix</code>. Dispatches <code>cmd-category-edit</code> / <code>cmd-category-delete</code> ({ index }).",
      html: () => `
        <div class="sb-canvas" style="flex-direction:column;width:100%">
          <cmd-category-card index="0" name="Birthday" image="Blue" key-prefix="sbc_" style="width:100%"></cmd-category-card>
          <cmd-category-card index="1" name="Work" key-prefix="sbc_" style="width:100%"></cmd-category-card>
        </div>
        <div class="sb-log" id="log-cmd-category-card">events: none</div>
      `,
      init: () => {
        document.querySelectorAll("#cmd-category-card cmd-category-card").forEach(card => {
          card.addEventListener("cmd-category-edit", (e) => log("cmd-category-card", "edit idx=" + e.detail.index));
          card.addEventListener("cmd-category-delete", (e) => log("cmd-category-card", "delete idx=" + e.detail.index));
        });
      }
    });

    // ---- smd-date-picker ----
    sections.push({
      id: "smd-date-picker",
      name: "smd-date-picker",
      tag: "<smd-date-picker>",
      desc: "Read-only date field backed by flatpickr with a Clear button. Attributes: <code>value</code> (a date string in <code>format</code>, default ISO <code>Y-m-d</code>), <code>format</code> (default <code>Y-m-d</code>), <code>alt-format</code> (display format, default <code>D j M Y</code>), <code>first-day-of-week</code> (0-6), <code>readonly</code>, <code>disabled</code>, <code>no-clear</code>. Dispatches <code>smd-date-picker-change</code> ({ value }).",
      html: () => `
        <div class="sb-canvas" style="flex-direction:column;gap:0.75rem;align-items:flex-start">
          <div style="min-width:260px;width:100%;max-width:340px">
            <label class="form-label mb-1">Sleep Until (clearable)</label>
            <smd-date-picker id="sb-date-picker" first-day-of-week="2"></smd-date-picker>
          </div>
          <div style="min-width:260px;width:100%;max-width:340px">
            <label class="form-label mb-1">Once date, d/m/Y, no Clear</label>
            <smd-date-picker id="sb-date-picker-cm" no-clear format="d/m/Y" alt-format="d/m/Y" value="18/09/2026"></smd-date-picker>
          </div>
          <div style="min-width:260px;width:100%;max-width:340px">
            <label class="form-label mb-1">Read-only view</label>
            <smd-date-picker id="sb-date-picker-ro" readonly value="2026-09-18"></smd-date-picker>
          </div>
        </div>
        <div class="sb-log" id="log-smd-date-picker">events: none yet</div>
      `,
      init: () => {
        document.querySelectorAll("smd-date-picker").forEach((el) => {
          if (el.closest("#smd-date-picker")) el.addEventListener("smd-date-picker-change", (e) => log("smd-date-picker", "changed value=\"" + e.detail.value + "\""));
        });
      }
    });

    // ---- qrlink-card ----
    sections.push({
      id: "qrlink-card",
      name: "qrlink-card",
      tag: "<qrlink-card>",
      desc: "A QRLinks link tile: image thumbnail (via <code>smd-image</code>), title, description and the QR button (hidden when <code>url</code> is empty). Attributes: <code>index</code>, <code>title</code>, <code>description</code>, <code>url</code>, <code>image</code>, <code>key-prefix</code>. Dispatches <code>qrlink-qr</code> ({ index, url, title }).",
      html: () => `
        <div class="sb-canvas" style="flex-direction:column;width:100%">
          <div class="sb-stack" id="sb-qrlink-cards" style="width:100%">
            <qrlink-card index="0" title="Example Site" url="https://example.com" description="A demo link" image="Blue" key-prefix="sbq_" style="width:100%"></qrlink-card>
            <qrlink-card index="1" title="No URL Link" description="QR button hidden" key-prefix="sbq_" style="width:100%"></qrlink-card>
          </div>
        </div>
        <div class="sb-log" id="log-qrlink-card">events: none yet</div>
      `,
      init: () => {
        localStorage.setItem("sbq_images", JSON.stringify([
          { name: "Blue", data: "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="#39cbfb"/></svg>') }
        ]));
        document.querySelectorAll("#qrlink-card qrlink-card").forEach(card => {
          card.addEventListener("qrlink-qr", (e) => log("qrlink-card", "qr url=" + e.detail.url + " title=" + e.detail.title));
        });
      }
    });

    // ============================ RENDER ============================
    function renderAll() {
      const main = document.getElementById("main");
      const nav = document.querySelector("nav.sb-nav");
      nav.innerHTML = "";
      main.innerHTML = "";

      sections.forEach(s => {
        // nav link
        const a = document.createElement("a");
        a.href = "#" + s.id;
        a.textContent = s.name;
        nav.appendChild(a);

        // section
        const section = document.createElement("section");
        section.className = "sb-section";
        section.id = s.id;
        section.innerHTML =
          `<a name="${s.id}"></a>` +
          `<h2>${s.name}</h2>` +
          `<span class="sb-tag">${escHtml(s.tag)}</span>` +
          `<p class="sb-desc">${s.desc}</p>` +
          s.html();
        main.appendChild(section);
      });

      // append the always-present smd-modal + smd-page hosts (reused across renders)
      ensureSharedHosts();

      sections.forEach(s => { if (typeof s.init === "function") s.init(); });
    }

    function ensureSharedHosts() {
      // smd-modal is fixed overlay; render once and remove before re-adding
      let existing = document.getElementById("sb-modal");
      if (existing) existing.remove();
      const modal = document.createElement("smd-modal");
      modal.id = "sb-modal";
      modal.title = "SmdModal title";
      modal.content = "<p>This is modal <code>content</code>. Buttons below are driven by the selector in the smd-modal section.</p>";
      document.body.appendChild(modal);

      let page = document.getElementById("sb-page");
      if (page) page.remove();
      page = document.createElement("smd-page");
      page.id = "sb-page";
      page.title = "SmdPage title";
      page.content = "<p>This is full-screen <code>smd-page</code> content. Click a footer button to see the event log.</p>";
      page.buttons = [
        { text: "Cancel", variant: "secondary", action: "cancel" },
        { text: "OK", variant: "success", action: "done" }
      ];
      document.body.appendChild(page);
    }

    renderAll();
  </script>
</body>
</html>
