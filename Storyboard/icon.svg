<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Storyboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- easel legs -->
  <path d="M150 404l46-92 24 12-40 92z" fill="#78350f" opacity="0.85"/>
  <path d="M362 404l-46-92-24 12 40 92z" fill="#78350f" opacity="0.85"/>

  <!-- board -->
  <rect x="100" y="92" width="312" height="234" rx="20" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="100" y="92" width="312" height="234" rx="20" fill="none" stroke="#0f172a" stroke-width="10"/>
  <rect x="122" y="114" width="268" height="190" rx="10" fill="#f8fafc"/>

  <!-- stickers on the board -->
  <g>
    <circle cx="184" cy="172" r="26" fill="#fb7185" stroke="#0f172a" stroke-width="6"/>
    <path d="M172 168h24M184 156v24" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <rect x="236" y="146" width="104" height="14" rx="7" fill="#0f172a" opacity="0.8"/>
    <rect x="236" y="174" width="76" height="12" rx="6" fill="#475569" opacity="0.75"/>
    <path d="M160 268c26-26 52 18 78-8s52 12 78-10" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
    <circle cx="330" cy="238" r="22" fill="#fbbf24" stroke="#0f172a" stroke-width="6"/>
    <path d="M330 222l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#fff"/>
  </g>

  <!-- tray -->
  <rect x="150" y="318" width="212" height="18" rx="9" fill="#cbd5e1" stroke="#0f172a" stroke-width="7"/>
</svg>
