<svg fill="url(#bg)" stroke="#fff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Stacked cards behind -->
  <rect x="176" y="116" width="236" height="236" rx="28" fill="#c7d2fe" opacity=".75"/>
  <rect x="152" y="144" width="236" height="236" rx="28" fill="#dbeafe" opacity=".9"/>

  <!-- Front card -->
  <rect x="128" y="172" width="256" height="220" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="128" y="172" width="256" height="44" rx="28" fill="#e8edff"/>
  <rect x="128" y="194" width="256" height="22" fill="#e8edff"/>

  <!-- Row 1 (with nested sub-items, the "list of lists") -->
  <circle cx="164" cy="246" r="11" fill="#4f46e5"/>
  <rect x="186" y="239" width="140" height="14" rx="7" fill="#374151"/>
  <rect x="196" y="264" width="11" height="11" rx="3" fill="#93c5fd"/>
  <rect x="214" y="264" width="104" height="10" rx="5" fill="#9ca3af"/>
  <rect x="196" y="284" width="11" height="11" rx="3" fill="#93c5fd"/>
  <rect x="214" y="284" width="80" height="10" rx="5" fill="#9ca3af"/>

  <!-- Row 2 -->
  <circle cx="164" cy="326" r="11" fill="#06b6d4"/>
  <rect x="186" y="319" width="120" height="14" rx="7" fill="#374151"/>

  <!-- Row 3 -->
  <circle cx="164" cy="362" r="11" fill="#22c55e"/>
  <rect x="186" y="355" width="150" height="14" rx="7" fill="#374151"/>
</svg>
