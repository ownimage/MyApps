services:
  app:
    build:
      context: ../..
      dockerfile: SolarControlar/server/Dockerfile
    container_name: solarcontrolar
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - ..:/web/SolarControlar:ro
      - ../../shared:/web/shared:ro
    command: ["cron", "-f"]
    restart: unless-stopped
    

