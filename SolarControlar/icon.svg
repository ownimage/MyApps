<svg fill="url(#bg)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Sun circle -->
  <circle cx="256" cy="220" r="72" fill="#fbbf24" filter="url(#shadow)"/>
  <circle cx="256" cy="220" r="48" fill="#fcd34d"/>

  <!-- Sun rays -->
  <g stroke="#fbbf24" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="120" x2="256" y2="100"/>
    <line x1="256" y1="340" x2="256" y2="320"/>
    <line x1="156" y1="220" x2="136" y2="220"/>
    <line x1="376" y1="220" x2="356" y2="220"/>
    <line x1="186" y1="150" x2="172" y2="136"/>
    <line x1="340" y1="304" x2="326" y2="290"/>
    <line x1="326" y1="150" x2="340" y2="136"/>
    <line x1="172" y1="304" x2="186" y2="290"/>
  </g>

  <!-- Battery -->
  <rect x="196" y="340" width="120" height="56" rx="8" fill="#fff" filter="url(#shadow)"/>
  <rect x="316" y="356" width="12" height="24" rx="4" fill="#fff"/>
  <rect x="208" y="352" width="80" height="32" rx="4" fill="#22c55e"/>
</svg>
